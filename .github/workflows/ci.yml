
name: Laravel CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, gd, pdo, sqlite3, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan config:clear
          echo "APP_DEBUG=true" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "FILESYSTEM_DRIVER=local" >> .env
          echo "MAIL_MAILER=log" >> .env
          echo "DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite" >> .env

      - name: Run database migrations
        run: php artisan migrate:fresh --force

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check code style with Laravel Pint
        run: ./vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test --stop-on-failure

      - name: Dump Laravel logs on failure
        if: failure()
        run: |
          echo "=== Laravel log files ==="
          find storage/logs -maxdepth 1 -type f -print
          for file in storage/logs/*.log; do
            if [ -f "$file" ]; then
              echo "=== $file ==="
              tail -n 200 "$file"
            fi
          done