$kind: http-request
name: Delete Course
method: DELETE
url: '{{apiUrl}}/admin/courses/{{courseId}}'
order: 1000
description: Cleans up the course created in Admin - Courses (and its lessons).
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns a confirmation message', () => {
        pm.expect(pm.response.json()).to.have.property('message');
      });
