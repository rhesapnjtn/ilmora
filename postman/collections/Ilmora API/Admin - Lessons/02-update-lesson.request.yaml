$kind: http-request
name: Update Lesson
method: PUT
url: '{{apiUrl}}/admin/courses/{{courseId}}/lessons/{{lessonId}}'
order: 2000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Pelajaran Uji Otomatis (diperbarui)",
      "duration": "12:30",
      "video_url": "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns updated lesson', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('message');
        pm.expect(json.lesson.title).to.eql('Pelajaran Uji Otomatis (diperbarui)');
        pm.expect(json.lesson.duration).to.eql('12:30');
        pm.expect(json.lesson.videoUrl).to.eql('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
      });
