$kind: http-request
name: Delete Lesson
method: DELETE
url: '{{apiUrl}}/admin/courses/{{courseId}}/lessons/{{lessonId}}'
order: 3000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns a confirmation message', () => {
        pm.expect(pm.response.json()).to.have.property('message');
      });
