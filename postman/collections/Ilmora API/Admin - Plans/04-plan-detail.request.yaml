$kind: http-request
name: Plan Detail
method: GET
url: '{{apiUrl}}/admin/plans/{{planId}}'
order: 4000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // planId is captured by Admin - Plans > Create Plan.
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns plan detail', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('plan');
        pm.expect(json.plan).to.include.keys('id', 'slug', 'name', 'monthly', 'annual', 'features', 'courseIds');
      });
