$kind: http-request
name: Update Plan
method: PUT
url: '{{apiUrl}}/admin/plans/{{planId}}'
order: 5000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Paket Uji Otomatis (diperbarui)",
      "monthly": 60000,
      "annual": 600000,
      "features": ["Fitur uji 1", "Fitur uji 2", "Fitur uji 3"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns updated plan', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('message');
        pm.expect(json.plan.name).to.eql('Paket Uji Otomatis (diperbarui)');
        pm.expect(json.plan.monthly).to.eql(60000);
      });
