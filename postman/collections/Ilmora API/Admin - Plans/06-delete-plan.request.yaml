$kind: http-request
name: Delete Plan
method: DELETE
url: '{{apiUrl}}/admin/plans/{{planId}}'
order: 6000
description: Cleans up the plan created earlier in this run.
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns a confirmation message', () => {
        pm.expect(pm.response.json()).to.have.property('message');
      });
