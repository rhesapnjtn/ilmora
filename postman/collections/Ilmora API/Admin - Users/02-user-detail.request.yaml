$kind: http-request
name: User Detail
method: GET
url: '{{apiUrl}}/admin/users/{{userId}}'
order: 2000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // userId is captured by Admin - Users > List Users.
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns user with subscriptions and payments', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('user');
        pm.expect(json.user).to.include.keys('id', 'name', 'email', 'role', 'subscriptions', 'payments');
      });
