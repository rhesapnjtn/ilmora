$kind: http-request
name: Update User
method: PUT
url: '{{apiUrl}}/admin/users/{{userId}}'
order: 3000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Pengguna Uji Ilmora"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns updated user', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('message');
        pm.expect(json.user.name).to.eql('Pengguna Uji Ilmora');
      });
