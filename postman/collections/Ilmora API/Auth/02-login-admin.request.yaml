$kind: http-request
name: Login (admin)
method: POST
url: '{{apiUrl}}/login'
order: 2000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('response has user and token', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('user');
        pm.expect(json).to.have.property('token').that.is.a('string').and.is.not.empty;
        pm.expect(json.user.role).to.eql('admin');
      });
      const json = pm.response.json();
      if (json.token) {
        pm.collectionVariables.set('token', json.token);
        pm.collectionVariables.set('adminToken', json.token);
      }
