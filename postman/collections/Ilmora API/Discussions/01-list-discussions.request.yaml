$kind: http-request
name: List Discussions
method: GET
url: '{{apiUrl}}/courses/{{courseSlug}}/lessons/{{lessonSlug}}/discussions'
order: 1000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns a discussions list', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('discussions').that.is.an('array');
        if (json.discussions.length) {
          pm.expect(json.discussions[0]).to.have.property('replies').that.is.an('array');
        }
      });
      pm.test('returns pagination meta', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('meta');
        pm.expect(json.meta).to.include.keys('currentPage', 'lastPage', 'perPage', 'total', 'hasMore');
        pm.expect(json.meta.currentPage).to.equal(1);
        pm.expect(json.meta.perPage).to.be.a('number');
        pm.expect(json.meta.total).to.be.at.least(json.discussions.length);
      });
