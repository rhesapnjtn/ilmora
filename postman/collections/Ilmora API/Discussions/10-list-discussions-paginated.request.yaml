$kind: http-request
name: List Discussions (paginated)
method: GET
url: '{{apiUrl}}/courses/{{courseSlug}}/lessons/{{lessonSlug}}/discussions?per_page=1&page=1'
order: 7000
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: per_page
    value: '1'
    description: Discussions per page (1-50, default 10)
  - key: page
    value: '1'
    description: Page number
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('honours per_page and returns pagination meta', () => {
        const json = pm.response.json();
        pm.expect(json.discussions).to.be.an('array');
        pm.expect(json.discussions.length).to.be.at.most(1);
        pm.expect(json.meta).to.include.keys('currentPage', 'lastPage', 'perPage', 'total', 'hasMore');
        pm.expect(json.meta.perPage).to.equal(1);
        pm.expect(json.meta.currentPage).to.equal(1);
        pm.expect(json.meta.total).to.be.at.least(json.discussions.length);
      });
