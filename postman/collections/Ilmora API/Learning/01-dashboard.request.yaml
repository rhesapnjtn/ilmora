$kind: http-request
name: Dashboard
method: GET
url: '{{apiUrl}}/dashboard'
order: 1000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('has dashboard structure', () => {
        const json = pm.response.json();
        pm.expect(json).to.include.keys('stats', 'enrolledCourses');
        pm.expect(json.stats).to.include.keys('courses', 'completedLessons', 'learningMinutes');
      });
