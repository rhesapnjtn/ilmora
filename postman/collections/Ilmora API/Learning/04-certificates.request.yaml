$kind: http-request
name: Certificates
method: GET
url: '{{apiUrl}}/certificates'
order: 4000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('has certificates and recipient', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('certificates').that.is.an('array');
        pm.expect(json).to.have.property('recipient');
      });
