$kind: http-request
name: 'Create Discussion (notification source)'
method: POST
url: '{{apiUrl}}/courses/{{courseSlug}}/lessons/{{lessonSlug}}/discussions'
order: 1000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "body": "Diskusi ini dipakai untuk menguji notifikasi balasan."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201 Created', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.expect(json.discussion).to.include.keys('id', 'body', 'user');
      if (json.discussion) {
        pm.collectionVariables.set('notificationDiscussionId', String(json.discussion.id));
        try {
          pm.environment.set('notificationDiscussionId', String(json.discussion.id));
        } catch (error) {
          // No environment selected: the collection variable is enough.
        }
      }
