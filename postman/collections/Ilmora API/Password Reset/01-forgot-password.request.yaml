$kind: http-request
name: Forgot Password
method: POST
url: '{{apiUrl}}/password/forgot'
order: 1000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testRunEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('always returns the generic message (no user enumeration)', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('message').that.is.a('string');
      });
