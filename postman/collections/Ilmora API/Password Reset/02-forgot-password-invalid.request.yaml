$kind: http-request
name: Forgot Password (invalid email)
method: POST
url: '{{apiUrl}}/password/forgot'
order: 2000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422 Unprocessable Entity', () => pm.response.to.have.status(422));
      pm.test('validation error on email', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('errors');
        pm.expect(json.errors).to.have.property('email');
      });
