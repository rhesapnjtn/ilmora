$kind: http-request
name: Reset Password (invalid token)
method: POST
url: '{{apiUrl}}/password/reset'
order: 3000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testRunEmail}}",
      "token": "invalid-reset-token",
      "password": "{{newPassword}}",
      "password_confirmation": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422 for an invalid token', () => pm.response.to.have.status(422));
      pm.test('validation error on email', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('errors');
        pm.expect(json.errors).to.have.property('email');
      });
