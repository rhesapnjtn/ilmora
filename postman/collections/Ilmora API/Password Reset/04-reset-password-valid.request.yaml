$kind: http-request
name: Reset Password (valid token)
method: POST
url: '{{apiUrl}}/password/reset'
order: 4000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testRunEmail}}",
      "token": "{{resetToken}}",
      "password": "{{newPassword}}",
      "password_confirmation": "{{newPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.environment.get('resetToken')) {
        console.warn('resetToken is empty. Trigger Forgot Password, then copy the token from the reset email (or the password_reset_tokens table) into the resetToken environment variable.');
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      // With a real, unexpired token this returns 200; without one it returns
      // 422 (invalid/expired). Accept both so the request is safe to run.
      pm.test('status is 200 (valid token) or 422 (missing/invalid token)', () => {
        pm.expect([200, 422]).to.include(pm.response.code);
      });
