$kind: http-request
name: Update Profile
method: PUT
url: '{{apiUrl}}/profile'
order: 1000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{currentUserName}}",
      "email": "{{currentUserEmail}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // currentUserName/currentUserEmail are captured by Auth > Me.
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns updated user and message', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('user');
        pm.expect(json).to.have.property('message');
        pm.expect(json.user).to.not.have.property('password');
      });
