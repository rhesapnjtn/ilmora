$kind: http-request
name: Update Password (wrong current)
method: PUT
url: '{{apiUrl}}/password'
order: 3000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "wrong-current-password",
      "password": "{{newPassword}}",
      "password_confirmation": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 422 Unprocessable Entity', () => pm.response.to.have.status(422));
      pm.test('validation error on current_password', () => {
        const json = pm.response.json();
        pm.expect(json.errors).to.have.property('current_password');
      });
