$kind: http-request
name: Update Password
method: PUT
url: '{{apiUrl}}/password'
order: 4000
description: >-
  Rotates the signed-in user's password from testUserPassword to newPassword and
  revokes other sessions. After running this, subsequent logins must use
  newPassword.
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "{{testUserPassword}}",
      "password": "{{newPassword}}",
      "password_confirmation": "{{newPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('returns a confirmation message', () => {
        pm.expect(pm.response.json()).to.have.property('message');
      });
