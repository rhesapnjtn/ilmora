$kind: http-request
name: Logout
method: POST
url: '{{apiUrl}}/logout'
order: 1000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('response has message', () => {
        pm.expect(pm.response.json()).to.have.property('message');
      });
