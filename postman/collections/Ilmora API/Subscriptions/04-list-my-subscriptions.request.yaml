$kind: http-request
name: List My Subscriptions
method: GET
url: '{{apiUrl}}/subscriptions'
order: 4000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200 OK', () => pm.response.to.have.status(200));
      pm.test('lists the signed-in user subscriptions', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('subscriptions').that.is.an('array');
        const target = Number(pm.environment.get('subscriptionId'));
        const match = json.subscriptions.find((item) => item.id === target);
        pm.expect(match, 'created order should be listed').to.exist;
        pm.expect(match.status).to.eql('pending');
      });
