name: Ilmora Local
values:
  - key: baseUrl
    value: 'http://127.0.0.1:8000'
    description: Ilmora app base URL (Laravel server)
  - key: apiUrl
    value: '{{baseUrl}}/api'
    description: REST API base path
  - key: adminEmail
    value: admin@ilmora.test
    description: 'Seeded administrator account (php artisan db:seed)'
  - key: adminPassword
    value: password
    description: Seeded administrator password (local only)
