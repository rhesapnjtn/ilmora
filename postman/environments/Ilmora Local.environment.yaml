    value: Password123
    description: 'Password for the test user (min 8, mixed case, numbers)'
  - key: newPassword
    value: Password1234
    description: New password used by change/reset password requests
  - key: courseSlug
    value: laravel-vue-3-full-stack
    description: Sample published course slug
  - key: lessonSlug
    value: 2-1
    description: Sample lesson slug within the sample course
  - key: certificateId
    value: ilr-cert-2026-001
    description: Sample certificate id
  - key: planSlug
    value: basic
    description: Sample plan slug
  - key: courseId
    value: ''
    description: Database id of a course (set by Admin Create Course)
  - key: lessonId
    value: ''
    description: Database id of a lesson (set by Admin Create Lesson)
  - key: planId
    value: ''
    description: Database id of a plan (set by Admin Create Plan)
  - key: userId
    value: ''
    description: Database id of a user (set by Admin List Users)
  - key: resetToken
    value: ''
    description: Valid reset token from the reset email or password_reset_tokens table
  - key: coursePublished
    value: ''
  - key: subscriptionId
    value: ''
